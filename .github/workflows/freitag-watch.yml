name: FREITAG F11 Lassie - Black Watch

on:
  schedule:
    # 6 vérifications par jour (heures UTC) -> ~toutes les 3h
    - cron: "0 6,9,12,15,18,21 * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour que le bot puisse committer seen_refs.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Sauvegarder l'état (seen_refs.json)
        run: |
          git config user.name "freitag-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_refs.json
          git diff --staged --quiet || git commit -m "update seen refs"
          git push
